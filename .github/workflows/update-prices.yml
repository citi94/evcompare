name: Update fuel prices

on:
  schedule:
    - cron: '17 6,15 * * *'   # twice a day (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch prices
        env:
          # Optional: register at https://www.developer.fuel-finder.service.gov.uk/
          # and add these as repository secrets for full national coverage.
          FUEL_FINDER_CLIENT_ID: ${{ secrets.FUEL_FINDER_CLIENT_ID }}
          FUEL_FINDER_CLIENT_SECRET: ${{ secrets.FUEL_FINDER_CLIENT_SECRET }}
        run: node scripts/update-prices.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/prices.json; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git commit -m "Update fuel prices $(date -u +%Y-%m-%d)"
          git push
